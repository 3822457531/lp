<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打卡 · 兰瓶美业</title>
  <link rel="stylesheet" href="../css/mobile-app.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <style>
    .clock-ring { cursor: pointer; user-select: none; }
    .clock-ring:active { transform: scale(.99); }
    .clock-ring.done .clock-inner .hint { color: var(--success); }
    .wifi-check { display: flex; align-items: center; gap: 8px; margin: 12px 14px 0; font-size: 13px; color: var(--text-2); min-height: 40px; }
    .wifi-check input { width: 18px; height: 18px; accent-color: var(--pink); }
    .month-row { display: flex; align-items: center; gap: 10px; margin: 12px 14px 6px; }
    .month-row input { flex: 1; height: 40px; border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; font-size: 13px; background: #fff; color: var(--text); }
    .att-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .att-row:last-child { border-bottom: none; }
    .att-row .d { color: var(--text); white-space: nowrap; }
    .att-row .t { color: var(--text-2); font-size: 12px; text-align: right; }
    .sum-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; font-size: 13px; border-bottom: 1px solid var(--border); }
    .sum-row:last-child { border-bottom: none; }
  </style>
<link rel="stylesheet" href="../assets/css/polish-mobile.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone">
      <div class="status-bar" style="background:#f8a0b4;color:#fff;"><span>9:41</span><span>兰瓶</span><span>●●●</span></div>
      <div class="phone-body">
        <div class="nav-bar">
          <a class="back" href="home.html">‹</a>
          <h1>考勤打卡</h1>
          <span class="right" id="refresh">↻</span>
        </div>

        <div class="clock-wrap">
          <div class="clock-ring" id="ring">
            <div class="clock-inner">
              <div class="time" id="clock">--:--:--</div>
              <div class="hint" id="hint">加载中…</div>
            </div>
          </div>
          <div class="clock-status" id="status">—</div>
          <div class="clock-loc" id="loc">定位准备中…</div>
          <div class="clock-tools">
            <div class="t"><div class="ic">⏰</div><div id="modeTxt">—</div></div>
            <div class="t"><div class="ic">🕘</div><div id="shiftTxt">—</div></div>
          </div>
          <label class="wifi-check"><input type="checkbox" id="wifiChk" /> 已连接门店 WiFi（<span id="wifiName">—</span>）</label>
        </div>

        <div class="month-row">
          <input type="month" id="month" />
        </div>

        <div class="section-hd">我的打卡记录 <span id="myHint">—</span></div>
        <div class="list-card" id="myList"></div>

        <div class="section-hd">本店出勤汇总 <span id="sumHint">—</span></div>
        <div class="list-card" id="sumList"></div>
      </div>

      <nav class="tab-bar">
        <a href="home.html"><span class="dot"></span>首页</a>
        <a href="customers.html"><span class="dot"></span>客户</a>
        <a href="verify.html"><span class="dot"></span>核销</a>
        <a href="mine.html"><span class="dot"></span>我的</a>
      </nav>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script>
    (function () {
      'use strict';
      var me = null;
      var settings = {};
      var geo = null;
      var todayData = null;
      var busy = false;

      function pad(n) { return String(n).padStart(2, '0'); }
      (function tick() {
        var d = new Date();
        document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        setTimeout(tick, 1000);
      })();

      function methodText(m) { return ({ wifi: 'WiFi 打卡', geo: '定位打卡', face: '人脸打卡' })[m] || m || '—'; }

      function paintToday() {
        var d = todayData || {};
        var t = d.today || null;
        var hint = document.getElementById('hint');
        var st = document.getElementById('status');
        var ring = document.getElementById('ring');
        document.getElementById('modeTxt').textContent = d.mode || '两段卡';
        document.getElementById('shiftTxt').textContent = (d.work_start || '—') + ' ~ ' + (d.work_end || '—');

        if (!t) {
          hint.textContent = '点击打卡';
          st.textContent = '今日未打卡';
          ring.classList.remove('done');
        } else if (!t.check_out) {
          hint.textContent = '点击下班打卡';
          st.textContent = '上班 ' + (t.check_in || '—') + ' · 未下班';
          ring.classList.remove('done');
        } else {
          hint.textContent = '今日已完成';
          st.textContent = '上班 ' + (t.check_in || '—') + ' · 下班 ' + (t.check_out || '—');
          ring.classList.add('done');
        }
        var mo = d.month || {};
        document.getElementById('myHint').textContent = '本月出勤 ' + (mo.days || 0) + ' 天 · 迟到 ' + (mo.late || 0) + ' · 缺勤 ' + (mo.absent || 0);
      }

      function loadToday() {
        return LP.get('/api/attendance/today').then(function (d) {
          todayData = d || {};
          paintToday();
        }).catch(function (e) {
          LP.toast(e.message || '打卡状态加载失败', 'error');
          document.getElementById('hint').textContent = '加载失败，点此重试';
        });
      }

      function loadRecords() {
        var myList = document.getElementById('myList');
        var sumList = document.getElementById('sumList');
        myList.innerHTML = LP.skeleton(3);
        sumList.innerHTML = LP.skeleton(3);
        var month = document.getElementById('month').value || LP.nowMonth();
        LP.get('/api/attendance', { month: month }).then(function (d) {
          var all = (d && d.list) || [];
          var mine = all.filter(function (r) { return String(r.user_id) === String(me.id); });
          document.getElementById('myHint').textContent = mine.length + ' 条 · ' + ((d && d.month) || month);
          myList.innerHTML = mine.length ? mine.map(function (r) {
            return '<div class="att-row"><span class="d">' + LP.esc(LP.fmt.date(r.date)) + '</span>' +
              '<span class="t">上班 ' + LP.esc(r.check_in || '—') + ' · 下班 ' + LP.esc(r.check_out || '—') +
              '<br>' + LP.esc(methodText(r.method)) + (r.status && r.status !== '正常' ? ' · ' + LP.esc(r.status) : '') + '</span></div>';
          }).join('') : LP.empty('本月暂无打卡记录');

          var sum = (d && d.summary) || [];
          document.getElementById('sumHint').textContent = sum.length + ' 人';
          sumList.innerHTML = sum.length ? sum.map(function (s) {
            return '<div class="sum-row"><span>' + LP.esc(s.user_name || '—') + '</span>' +
              '<span style="color:var(--text-2);font-size:12px">出勤 ' + LP.esc(s.days || 0) + ' 天 · 迟到 ' + LP.esc(s.late || 0) +
              ' · 缺勤 ' + LP.esc(s.absent || 0) + '</span></div>';
          }).join('') : LP.empty('暂无汇总数据');
        }).catch(function (e) {
          myList.innerHTML = LP.empty('考勤加载失败', '⚠');
          sumList.innerHTML = LP.empty('汇总加载失败', '⚠');
          LP.toast(e.message || '加载失败', 'error');
        });
      }

      function locate() {
        var locEl = document.getElementById('loc');
        if (!navigator.geolocation) { locEl.textContent = '当前环境不支持定位，将按「未授权定位」提交'; return; }
        locEl.textContent = '定位中…';
        navigator.geolocation.getCurrentPosition(function (p) {
          geo = p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6);
          locEl.textContent = '已定位 ' + geo;
        }, function () {
          geo = null;
          locEl.textContent = '定位未授权，将提交「未授权定位」';
        }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 });
      }

      function doCheck() {
        if (busy) return;
        var wifiOn = document.getElementById('wifiChk').checked;
        var payload = {
          method: wifiOn ? 'wifi' : 'geo',
          wifi: wifiOn ? (settings.wifi_name || '门店WiFi') : '',
          address: geo || '未授权定位'
        };
        busy = true;
        document.getElementById('hint').textContent = '提交中…';
        LP.post('/api/attendance/check', payload).then(function (r) {
          busy = false;
          LP.toast((r && r.action) || '打卡成功', 'success');
          return Promise.all([loadToday(), loadRecords()]);
        }).catch(function (e) {
          busy = false;
          LP.toast(e.message || '打卡失败', 'error');
          paintToday();
        });
      }

      document.getElementById('ring').addEventListener('click', doCheck);
      document.getElementById('month').addEventListener('change', loadRecords);
      document.getElementById('refresh').addEventListener('click', function () { loadToday(); loadRecords(); });

      LP.requireRoles(['manager']).then(function (u) {
        me = u;
        document.getElementById('month').value = LP.nowMonth();
        locate();
        return LP.get('/api/settings').catch(function () { return {}; }).then(function (s) {
          settings = s || {};
          document.getElementById('wifiName').textContent = settings.wifi_name || '门店 WiFi';
          if (settings.clock_methods && String(settings.clock_methods).indexOf('wifi') < 0) {
            document.getElementById('wifiChk').disabled = true;
            document.getElementById('wifiChk').parentNode.style.opacity = '.5';
          }
          return Promise.all([loadToday(), loadRecords()]);
        });
      }).catch(function () {});
    })();
  </script>
</body>
</html>
