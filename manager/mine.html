<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的 · 兰瓶美业</title>
  <link rel="stylesheet" href="../css/mobile-app.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <style>
    .me-top { display: flex; align-items: center; gap: 12px; }
    .me-top .av-circle { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg,#ffb3c6,#e85a7a); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; flex: 0 0 auto; }
    .me-top h2 { font-size: 16px; }
    .me-top p { font-size: 12px; color: var(--text-2); margin-top: 4px; word-break: break-word; }
    .me-stat { display: flex; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .me-stat > div { flex: 1; text-align: center; }
    .me-stat .n { font-size: 15px; font-weight: 700; color: #d94a6b; }
    .me-stat .l { font-size: 11px; color: var(--text-2); margin-top: 4px; }
    .me-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text); }
    .me-item:last-child { border-bottom: none; }
    .me-item .ic { width: 24px; text-align: center; margin-right: 8px; }
    .me-item em { font-style: normal; color: var(--text-3); }
    .btn-block { width: calc(100% - 32px); }
  </style>
<link rel="stylesheet" href="../assets/css/polish-mobile.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone">
      <div class="status-bar" style="background:#f8a0b4;color:#fff;"><span>9:41</span><span>兰瓶</span><span>●●●</span></div>
      <div class="phone-body">
        <div class="list-card">
          <div class="me-top">
            <div class="av-circle" id="avatar">店</div>
            <div style="min-width:0">
              <h2 id="name">加载中…</h2>
              <p id="sub">—</p>
            </div>
          </div>
          <div class="me-stat">
            <div><div class="n" id="perf">—</div><div class="l">本月业绩</div></div>
            <div><div class="n" id="vc">—</div><div class="l">核销笔数</div></div>
            <div><div class="n" id="ca">—</div><div class="l">开卡金额</div></div>
          </div>
        </div>

        <div class="section-hd">门店信息 <span id="storeHint"></span></div>
        <div class="list-card" id="storeBox">
          <div class="lp-skeleton"><div></div><div></div></div>
        </div>

        <div class="section-hd">常用入口</div>
        <div class="list-card">
          <a class="me-item" href="settings.html"><span><span class="ic">⚙</span>设置</span><em>›</em></a>
          <a class="me-item" href="clockin.html"><span><span class="ic">⏱</span>考勤打卡</span><em>›</em></a>
          <a class="me-item" href="assessment.html"><span><span class="ic">🎯</span>考核情况</span><em>›</em></a>
          <a class="me-item" href="employees.html"><span><span class="ic">👥</span>员工管理</span><em>›</em></a>
          <a class="me-item" href="inventory.html"><span><span class="ic">📦</span>出入库</span><em>›</em></a>
        </div>

        <div style="padding:16px 14px 24px;">
          <button class="btn-block" id="logout" style="background:#fff;color:var(--danger);border:1px solid var(--danger);">退出登录</button>
        </div>
      </div>

      <nav class="tab-bar">
        <a href="home.html"><span class="dot"></span>首页</a>
        <a href="customers.html"><span class="dot"></span>客户</a>
        <a href="verify.html"><span class="dot"></span>核销</a>
        <a class="active" href="mine.html"><span class="dot"></span>我的</a>
      </nav>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script>
    (function () {
      'use strict';
      var me = null;

      LP.requireRoles(['manager']).then(function (u) {
        me = u;
        document.getElementById('name').textContent = u.name || '—';
        document.getElementById('sub').textContent = (u.position || '店长') + ' · ' + (u.store_name || '—') + ' · ' + LP.fmt.phone(u.phone || '');
        document.getElementById('avatar').textContent = String(u.name || '店').slice(-1);
        document.getElementById('storeHint').textContent = u.store_name || '';
        return LP.get('/api/workbench').catch(function () { return {}; });
      }).then(function (wb) {
        wb = wb || {};
        document.getElementById('perf').textContent = LP.fmt.money(wb.perf || 0);
        document.getElementById('vc').textContent = LP.fmt.num(wb.verify_count || 0);
        document.getElementById('ca').textContent = LP.fmt.money(wb.card_amount || 0);
        var box = document.getElementById('storeBox');
        var rows = [
          ['门店', (wb.user && wb.user.store_name) || (me && me.store_name) || '—'],
          ['门店编号', me && me.store_id ? '#' + me.store_id : '—'],
          ['本店客户', LP.fmt.num(wb.customers || 0) + ' 人'],
          ['待核销', LP.fmt.num(wb.pending_verify || 0) + ' 单'],
          ['统计月份', wb.month || LP.nowMonth()]
        ];
        box.innerHTML = rows.map(function (r) {
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;border-bottom:1px solid var(--border);font-size:13px;">' +
            '<span>' + LP.esc(r[0]) + '</span><em style="font-style:normal;color:var(--text-2)">' + LP.esc(r[1]) + '</em></div>';
        }).join('');
      }).catch(function (e) {
        if (e && e.message) LP.toast(e.message, 'error');
      });

      document.getElementById('logout').addEventListener('click', function () {
        LP.confirm('确认退出登录？', { okText: '退出', danger: true }).then(function (ok) {
          if (!ok) return;
          LP.logout();
        });
      });
    })();
  </script>
</body>
</html>
