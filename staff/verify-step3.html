<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>扫码核销 · 兰瓶美业</title>
  <link rel="stylesheet" href="../css/mobile-app.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <link rel="stylesheet" href="staff.css" />
<link rel="stylesheet" href="../assets/css/polish-mobile.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone">
      <div class="status-bar"><span>9:41</span><span>●●●</span></div>
      <div class="phone-body no-tab" id="body">
        <div class="nav-bar"><a class="back" href="verify-step1.html">‹</a><h1>扫码核销</h1></div>
        <div class="steps">
          <div class="s done"><span class="num">1</span>选择项目</div>
          <div class="s done"><span class="num">2</span>发送核销码</div>
          <div class="s active"><span class="num">3</span>扫码核销</div>
        </div>

        <div id="banner"></div>

        <div id="main">
          <div class="scan-wrap" id="scanWrap">
            <div class="lp-scan-stage">
              <video id="video" playsinline muted autoplay></video>
              <div class="lp-scan-frame"></div>
            </div>
            <p class="scan-hint" id="scanHint">将客户短信中的二维码 / 核销码对准取景框</p>
            <div style="text-align:center;padding-top:10px;">
              <button class="btn-sm outline" id="rescan">重新扫描</button>
            </div>
          </div>

          <div id="scanTip"></div>

          <div class="or-line" id="orLine">或手动输入核销码</div>

          <div style="padding:0 16px 8px;" id="manualWrap">
            <input id="code" class="code-input" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="6 位核销码" />
            <div style="height:12px;"></div>
            <button class="btn-block" id="manualBtn">确认核销</button>
          </div>
          <div id="msg"></div>
          <div class="pad-bottom"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script src="staff.js"></script>
  <script>
    (function () {
      'use strict';
      var id = LP.param('id');
      var record = null, pending = null;
      var stream = null, detector = null, running = false, timer = null, busy = false, finished = false;
      var supportScan = (typeof BarcodeDetector !== 'undefined') &&
        !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

      STAFF.guard().then(function () {
        if (!supportScan) {
          hideScan('当前浏览器不支持扫码，请手动输入核销码');
        }
        if (id) {
          return LP.get('/api/verifications/' + id).then(function (d) {
            record = d;
            renderBanner();
            lockIfDone();
          }).catch(function (e) {
            LP.mount('#banner', '<div class="st-err">' + STAFF.esc(e.message) + '</div>');
          });
        }
      }).then(function () {
        if (supportScan && !(record && record.status !== '待核销')) startScan();
      }).catch(function () { });

      function renderBanner() {
        if (!record) return;
        var ok = record.status === '待核销';
        LP.mount('#banner',
          '<div style="margin:0 16px 10px;padding:12px 14px;border-radius:12px;background:' +
          (ok ? 'var(--pink-soft)' : 'var(--danger-bg)') + ';font-size:12px;line-height:1.7;color:' +
          (ok ? 'var(--text)' : 'var(--danger)') + ';">' +
          (ok ? '待核销：' : '注意：') + STAFF.esc(record.customer_name || '客户') + ' · ' +
          (record.total_times || 0) + ' 次 · ' + STAFF.money(record.total_amount || 0) +
          '<br/>核销码 ' + STAFF.esc(record.code || '—') + ' · 状态 ' + STAFF.esc(record.status || '—') +
          '</div>');
      }

      /* ---------------- 摄像头 / 识别 ---------------- */
      function startScan() {
        var video = LP.$('#video');
        if (!video) return;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
          .then(function (s) {
            stream = s;
            video.srcObject = s;
            var p = video.play();
            if (p && p.catch) p.catch(function () { });
            return;
          })
          .then(function () {
            try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; }
            if (!detector) { hideScan('当前浏览器不支持二维码识别，请手动输入核销码'); return; }
            running = true;
            LP.$('#scanHint').textContent = '正在扫描…将客户二维码对准取景框';
            tick();
          })
          .catch(function () {
            hideScan('无法打开摄像头，请手动输入核销码');
          });
      }

      function tick() {
        if (!running || finished) return;
        var video = LP.$('#video');
        if (!video || !video.videoWidth) { timer = setTimeout(tick, 300); return; }
        detector.detect(video).then(function (list) {
          if (!running || finished) return;
          if (list && list.length && list[0].rawValue) {
            onScan(list[0].rawValue);
            return;
          }
          timer = setTimeout(tick, 320);
        }).catch(function () {
          timer = setTimeout(tick, 600);
        });
      }

      function stopDetect() {
        running = false;
        if (timer) { clearTimeout(timer); timer = null; }
      }

      function stopStream() {
        stopDetect();
        if (stream) {
          try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { }
          stream = null;
        }
        var v = LP.$('#video');
        if (v) { try { v.pause(); v.srcObject = null; } catch (e) { } }
      }

      function hideScan(msg) {
        var w = LP.$('#scanWrap');
        if (w) w.classList.add('st-hide');
        var o = LP.$('#orLine');
        if (o) o.style.marginTop = '8px';
        var t = LP.$('#scanTip');
        if (msg && t && !finished) {
          LP.mount('#scanTip', '<div class="tip-box" style="margin:0 16px 10px;">' + STAFF.esc(msg) + '</div>');
        }
        if (msg) LP.toast(msg, 'error');
      }

      /* 已核销/已取消的单据：锁掉扫码与手输，只展示状态 */
      function lockIfDone() {
        if (!record || record.status === '待核销') return;
        hideScan('');
        var o = LP.$('#orLine');
        if (o) o.classList.add('st-hide');
        var mw = LP.$('#manualWrap');
        if (mw) mw.classList.add('st-hide');
        var t = LP.$('#scanTip');
        if (t) {
          LP.mount('#scanTip', '<div class="tip-box" style="margin:0 16px 12px;">该核销单状态为「' +
            STAFF.esc(record.status || '—') + '」，无需再次核销。</div>' +
            '<div style="padding:0 16px;"><button class="btn-block" id="lockHome">返回首页</button></div>');
          var b = LP.$('#lockHome');
          if (b) b.addEventListener('click', function () { location.href = 'home.html'; });
        }
      }

      function resume() {
        busy = false;
        if (!supportScan) return;
        var w = LP.$('#scanWrap');
        if (w) w.classList.remove('st-hide');
        if (detector && stream) {
          running = true;
          LP.$('#scanHint').textContent = '正在扫描…将客户二维码对准取景框';
          tick();
        } else {
          startScan();
        }
      }

      LP.$('#rescan').addEventListener('click', function () {
        LP.mount('#msg', '');
        busy = false;
        resume();
      });

      /* ---------------- 解析扫码内容 ---------------- */
      function parseScan(raw) {
        var t = String(raw || '').trim();
        var out = { raw: t, token: null, code: null, id: null };
        if (!t) return out;
        var m;
        if (/^https?:\/\//i.test(t)) {
          try {
            var u = new URL(t);
            out.token = u.searchParams.get('t') || u.searchParams.get('token') || null;
            out.code = u.searchParams.get('code') || null;
            var qid = u.searchParams.get('id');
            out.id = qid ? Number(qid) : null;
          } catch (e) { }
        }
        if (!out.token && (m = t.match(/[?&]t=([A-Za-z0-9_-]+)/))) out.token = m[1];
        if (!out.code && (m = t.match(/[?&]code=(\d{4,8})/))) out.code = m[1];
        if (!out.token && !out.code && !out.id && t.charAt(0) === '{') {
          try {
            var j = JSON.parse(t);
            out.token = j.t || j.token || null;
            out.code = j.code ? String(j.code) : null;
            out.id = j.id ? Number(j.id) : null;
          } catch (e) { }
        }
        if (!out.token && !out.code && !out.id && /^\d{4,8}$/.test(t)) out.code = t;
        if (!out.token && !out.code && !out.id && /^[A-Za-z0-9_-]{10,64}$/.test(t)) out.token = t;
        return out;
      }

      function findPending(pred) {
        if (pending) return Promise.resolve(pending.filter(pred)[0] || null);
        return LP.get('/api/verifications', { status: '待核销' }).then(function (list) {
          pending = list || [];
          return pending.filter(pred)[0] || null;
        });
      }

      function onScan(raw) {
        if (busy || finished) return;
        stopDetect();
        var p = parseScan(raw);
        LP.$('#scanHint').textContent = '已识别：' + raw.slice(0, 42);
        var task;
        if (p.token) {
          task = findPending(function (r) { return r.token === p.token; });
        } else if (p.code) {
          task = findPending(function (r) { return String(r.code) === String(p.code); });
        } else if (p.id) {
          task = Promise.resolve(null).then(function () { return LP.get('/api/verifications/' + p.id); });
        } else {
          showError('无法识别的二维码内容，请让客户重新出示核销链接');
          resume();
          return;
        }
        task.then(function (rec) {
          if (!rec) {
            showError('未找到对应的待核销单，请确认核销码是否已失效');
            resume();
            return;
          }
          confirmRec(rec);
        }).catch(function (e) {
          showError(e.message);
          resume();
        });
      }

      /* ---------------- 确认核销 ---------------- */
      function confirmRec(rec) {
        busy = true;
        LP.confirm('确认为「' + (rec.customer_name || '客户') + '」核销 ' + (rec.total_times || 0) +
          ' 次项目？（核销码 ' + (rec.code || '') + '）',
          { title: '确认核销', okText: '确认核销' }).then(function (ok) {
            if (!ok) {
              busy = false;
              resume();
              return;
            }
            LP.post('/api/verifications/' + rec.id + '/confirm', { code: rec.code })
              .then(function () { finish(rec); })
              .catch(function (e) {
                busy = false;
                showError(e.message);
                resume();
              });
          });
      }

      LP.$('#manualBtn').addEventListener('click', function () {
        if (busy || finished) return;
        var code = (LP.$('#code').value || '').trim();
        if (!/^\d{6}$/.test(code)) { LP.toast('请输入 6 位数字核销码', 'error'); return; }
        busy = true;
        var btn = this;
        btn.disabled = true;
        btn.textContent = '核销中…';
        stopDetect();

        var task;
        if (record) {
          task = Promise.resolve(record);
        } else {
          task = findPending(function (r) { return String(r.code) === code; });
        }
        task.then(function (rec) {
          if (!rec) throw new Error('未找到核销码 ' + code + ' 对应的待核销单');
          return LP.confirm('确认为「' + (rec.customer_name || '客户') + '」核销 ' + (rec.total_times || 0) +
            ' 次项目？（核销码 ' + code + '）',
            { title: '确认核销', okText: '确认核销' }).then(function (ok) {
              if (!ok) {
                busy = false;
                btn.disabled = false;
                btn.textContent = '确认核销';
                resume();
                return null;
              }
              return LP.post('/api/verifications/' + rec.id + '/confirm', { code: code }).then(function () {
                finish(rec);
              });
            });
        }).catch(function (e) {
          busy = false;
          btn.disabled = false;
          btn.textContent = '确认核销';
          showError(e.message);
          resume();
        });
      });

      function showError(msg) {
        LP.mount('#msg', '<div class="st-err">' + STAFF.esc(msg) + '</div>');
        LP.toast(msg, 'error');
      }

      function finish(rec) {
        finished = true;
        busy = true;
        stopStream();
        var d = new Date();
        var p = function (n) { return String(n).padStart(2, '0'); };
        var now = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        LP.mount('#banner', '');
        LP.mount('#main',
          '<div class="done-box">' +
          '<div class="done-ico">✓</div>' +
          '<h3>核销完成</h3>' +
          '<p>' + STAFF.esc(rec.customer_name || '客户') + ' · 核销 ' + (rec.total_times || 0) + ' 次<br/>' +
          '折合 ' + STAFF.money(rec.total_amount || 0) + '<br/>' + now + ' 由 ' + STAFF.esc((LP.user() || {}).name || '—') + ' 完成</p>' +
          '<a class="btn-block" href="home.html" style="display:flex;align-items:center;justify-content:center;">返回首页</a>' +
          '<div style="height:10px;"></div>' +
          '<a class="btn-sm outline" href="verify-step1.html">再核销一单</a>' +
          '</div>');
      }

      /* ---------------- 离开页面清理摄像头 ---------------- */
      window.addEventListener('pagehide', stopStream);
      window.addEventListener('beforeunload', stopStream);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) stopStream();
        else if (!finished && !busy && supportScan) resume();
      });
    })();
  </script>
</body>
</html>
