<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发送核销码 · 兰瓶美业</title>
  <link rel="stylesheet" href="../css/mobile-app.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <link rel="stylesheet" href="staff.css" />
<link rel="stylesheet" href="../assets/css/polish-mobile.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone">
      <div class="status-bar"><span>9:41</span><span>●●●</span></div>
      <div class="phone-body no-tab" id="body">
        <div class="nav-bar"><a class="back" href="verify-step1.html">‹</a><h1>发送核销码</h1></div>
        <div class="steps">
          <div class="s done" id="s1"><span class="num">1</span>选择项目</div>
          <div class="s active" id="s2"><span class="num">2</span>发送核销码</div>
          <div class="s" id="s3"><span class="num">3</span>扫码核销</div>
        </div>
        <div id="main"><div class="st-load">加载中…</div></div>
        <div class="pad-bottom"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script src="../assets/js/lp-qr.js"></script>
  <script src="staff.js"></script>
  <script>
    (function () {
      'use strict';
      var id = LP.param('id');
      var v = null;

      STAFF.guard().then(function () {
        if (!id) { location.replace('verify-step1.html'); return; }
        return LP.get('/api/verifications/' + id).then(function (d) {
          v = d;
          render();
        }).catch(function (e) { STAFF.fail(e); });
      }).catch(function () { });

      function render() {
        var pending = v.status === '待核销';
        var link = location.origin + (v.link || '');
        var html = '';

        html += '<div class="form-card" style="text-align:center;padding:18px 14px 16px;">' +
          '<div class="lp-code-hint">客户核销码</div>' +
          '<div class="lp-code-big" style="margin:6px 0 4px;">' + STAFF.esc(v.code || '—') + '</div>' +
          '<div id="qr" class="lp-qr" style="margin:12px auto;"></div>' +
          '<div class="lp-code-hint">客户扫码或打开短信链接即可核对本次消费</div>' +
          '</div>';

        html += '<div class="tip-box">📩 核销码已通过短信发送至 <b>' +
          STAFF.esc(LP.fmt.phone(v.customer_phone)) + '</b>（' + STAFF.esc(v.customer_name || '客户') + '），' +
          '客户打开短信中的链接后，请回到本页扫码完成核销。</div>';

        if (!pending) {
          html += '<div class="form-card" style="text-align:center;padding:14px;">' +
            '<span class="tag ' + STAFF.tagClass(v.status) + '">' + STAFF.esc(v.status || '—') + '</span>' +
            '<div class="st-muted" style="margin-top:8px;">该核销单当前状态为「' + STAFF.esc(v.status || '—') + '」，无需再次核销。</div>' +
            '</div>';
        }

        html += '<div class="section-hd">核销明细</div><div class="form-card" style="padding:4px 16px;">';
        var items = STAFF.items(v.items);
        if (!items.length) {
          html += '<div class="st-muted" style="padding:10px 0;">暂无明细</div>';
        } else {
          for (var i = 0; i < items.length; i++) {
            var it = items[i];
            html += '<div class="kv"><span class="k">' + STAFF.esc(it.name || '项目') + ' × ' + (it.times || 0) + ' 次</span>' +
              '<span class="v">' + STAFF.money((it.price || 0) * (it.times || 0)) + '</span></div>';
          }
        }
        html += '<div class="kv"><span class="k">合计</span><span class="v red">' +
          (v.total_times || 0) + ' 次 · ' + STAFF.money(v.total_amount || 0) + '</span></div>' +
          '<div class="kv"><span class="k">服务员工</span><span class="v">' + STAFF.esc(v.staff_name || '—') + '</span></div>' +
          '</div>';

        html += '<div class="section-hd">客户核销链接</div>' +
          '<div class="link-box" style="margin:0 16px 8px;"><span class="st-brk" style="font-size:12px;color:var(--text-2);">' +
          STAFF.esc(link) + '</span></div>' +
          '<div style="padding:0 16px 4px;"><button class="btn-sm outline" data-copy="1">复制链接</button></div>';

        if (pending) {
          html += '<div style="padding:14px 16px 4px;">' +
            '<button class="btn-block" id="goScan">已有客户扫码，去扫码核销</button></div>' +
            '<div style="padding:0 16px;"><button class="btn-sm ghost" data-cancel="1">取消本次核销</button></div>';
        } else {
          html += '<div style="padding:14px 16px 4px;"><a class="btn-block" href="home.html" ' +
            'style="display:flex;align-items:center;justify-content:center;">返回首页</a></div>';
        }

        LP.mount('#main', html);

        if (v.code) {
          var qr = LP.$('#qr');
          if (qr) {
            try { LPQR.render(qr, link, { size: 190 }); } catch (e) { }
          }
        }

        var copyBtn = LP.$('[data-copy]');
        if (copyBtn) copyBtn.addEventListener('click', function () { STAFF.copy(link); });

        var cancelBtn = LP.$('[data-cancel]');
        if (cancelBtn) {
          cancelBtn.addEventListener('click', function () {
            LP.confirm('确定取消本次核销？取消后核销码立即失效。', { okText: '确认取消' }).then(function (ok) {
              if (!ok) return;
              LP.post('/api/verifications/' + id + '/cancel', { reason: '员工取消' }).then(function () {
                LP.toast('已取消本次核销', 'success');
                setTimeout(function () { location.href = 'home.html'; }, 600);
              }).catch(function (e) { LP.toast(e.message, 'error'); });
            });
          });
        }

        var goScan = LP.$('#goScan');
        if (goScan) goScan.addEventListener('click', function () {
          location.href = 'verify-step3.html?id=' + id;
        });
      }
    })();
  </script>
</body>
</html>
