<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>员工首页 · 兰瓶美业</title>
  <link rel="stylesheet" href="../css/mobile-app.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <link rel="stylesheet" href="staff.css" />
<link rel="stylesheet" href="../assets/css/polish-mobile.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone">
      <div class="status-bar"><span>9:41</span><span>●●●</span></div>
      <div class="phone-body" id="body">
        <div class="st-load">加载中…</div>
      </div>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=60"></script>
  <script src="staff.js"></script>
  <script>
    (function () {
      'use strict';
      var wb = null;

      STAFF.guard().then(function () {
        STAFF.mountTab('home');
        return load();
      }).catch(function () { });

      function load() {
        STAFF.loading('正在加载工作台…');
        return LP.get('/api/workbench').then(function (d) {
          wb = d || {};
          render();
        }).catch(function (e) { STAFF.fail(e); });
      }

      function render() {
        var u = wb.user || LP.user() || {};
        var att = wb.attendance || [];
        var appts = wb.appointments || [];
        var bds = wb.birthdays || [];
        var html = '';

        html += '<div class="staff-top"><div class="brand">❀ 兰瓶美业</div>' +
          '<a href="messages.html" style="font-size:16px;">🔔</a></div>';

        html += '<div class="staff-profile">' +
          '<div class="av-circle av-letter">' + STAFF.esc((u.name || '员').slice(-2)) + '</div>' +
          '<div><h2>你好，' + STAFF.esc(u.name || '员工') + '</h2>' +
          '<p>' + STAFF.esc([u.position, u.store_name, u.level].filter(Boolean).join(' · ') || '—') + '</p></div>' +
          '</div>';

        html += '<div class="staff-banner"><img src="../assets/images/hero-banner.jpg" alt="" />' +
          '<div class="cap">用专业服务，遇见更美的自己</div></div>';

        html += '<div class="today-card">' +
          '<div><div class="n red">' + STAFF.money(wb.perf || 0) + '</div><div class="l">本月业绩</div></div>' +
          '<div><div class="n">' + (wb.verify_count || 0) + '</div><div class="l">本月核销</div></div>' +
          '<div><div class="n">' + (wb.pending_verify || 0) + '</div><div class="l">待核销</div></div>' +
          '<div><div class="n">' + (wb.customers || 0) + '</div><div class="l">本店客户</div></div>' +
          '</div>';

        html += '<div class="section-hd">快捷入口</div>' +
          '<div class="staff-menu">' +
          '<a class="menu-item" href="verify-step1.html"><span class="menu-ico i-scan">✓</span>核销</a>' +
          '<a class="menu-item" href="customers.html"><span class="menu-ico i-user">👤</span>客户</a>' +
          '<a class="menu-item" href="appointments.html"><span class="menu-ico i-cal">📅</span>预约</a>' +
          '<a class="menu-item" href="clockin.html"><span class="menu-ico i-pin">📍</span>打卡</a>' +
          '<a class="menu-item" href="assessment.html"><span class="menu-ico i-chart">📊</span>考核</a>' +
          '<a class="menu-item" href="salary.html"><span class="menu-ico i-cash">¥</span>薪资</a>' +
          '</div>';

        html += '<div class="section-hd">本月概览</div><div class="stat-grid">' +
          '<div class="st-cell"><div class="n">' + STAFF.money(wb.card_amount || 0) + '</div><div class="l">开卡金额</div></div>' +
          '<div class="st-cell"><div class="n">' + att.length + ' 天</div><div class="l">本月出勤</div></div>' +
          '<div class="st-cell"><div class="n">' + (wb.salary ? STAFF.money(wb.salary.total) : '—') + '</div><div class="l">本月薪资</div></div>' +
          '<div class="st-cell"><div class="n">' + (wb.month ? LP.fmt.month(wb.month) : '—') + '</div><div class="l">核算月份</div></div>' +
          '</div>';

        html += '<div class="section-hd">今日预约' +
          (appts.length ? '<a href="appointment-list.html" style="float:right;font-weight:400;color:var(--pink);font-size:12px;">全部 ›</a>' : '') +
          '</div>';
        if (!appts.length) {
          html += '<div class="st-muted" style="padding:0 16px 8px;">今日暂无预约</div>';
        } else {
          html += '<div class="list-card">';
          for (var i = 0; i < appts.length && i < 5; i++) {
            var a = appts[i];
            var t = STAFF.dt(a.start_time);
            html += '<div class="row" data-appt="' + a.id + '">' +
              '<div class="thumb" style="background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:18px;">📅</div>' +
              '<div class="info"><h4>' + STAFF.esc(a.customer_name || '客户') +
              '<span class="tag ' + STAFF.tagClass(a.status) + '" style="margin-left:6px;">' + STAFF.esc(a.status || '—') + '</span></h4>' +
              '<p>' + t.time + ' · ' + STAFF.esc(a.project_name || '项目待定') + '</p></div>' +
              '<div class="row-acts"><a class="btn-sm outline" href="appointment-list.html">查看</a></div>' +
              '</div>';
          }
          html += '</div>';
        }

        html += '<div class="section-hd">生日提醒</div>';
        if (!bds.length) {
          html += '<div class="st-muted" style="padding:0 16px 8px;">近期没有客户生日</div>';
        } else {
          html += '<ul class="notice-list">';
          for (var k = 0; k < bds.length && k < 5; k++) {
            var b = bds[k];
            var dl = STAFF.dayLeft(b.birthday);
            html += '<li><span>🎂 ' + STAFF.esc(b.name || '客户') + '</span>' +
              '<span class="date">' + STAFF.esc(STAFF.birthdayText(dl)) + '</span></li>';
          }
          html += '</ul>';
        }

        html += '<div class="pad-bottom"></div>';
        STAFF.body().innerHTML = html;
      }
    })();
  </script>
</body>
</html>
