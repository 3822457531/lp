<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>消费核销 · 兰瓶美业</title>
<link rel="stylesheet" href="/assets/css/lp-app.css" />
<style>
  :root { --pink: #e85a7a; --brown: #9a7d6f; --ink: #2f2a27; --t2: #8b8178; --line: #efe9e3; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #faf8f6; color: var(--ink); min-height: 100vh;
    background-image: radial-gradient(circle at 88% 4%, #fdeef2 0%, transparent 42%), radial-gradient(circle at 4% 90%, #f3ece5 0%, transparent 40%);
  }
  .cv-wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 40px; }
  .cv-brand { display: flex; align-items: center; gap: 10px; padding: 6px 2px 18px; }
  .cv-brand .mark {
    width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #e85a7a, #d9556f);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
  }
  .cv-brand h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .cv-brand p { margin: 2px 0 0; font-size: 11.5px; color: var(--t2); }
  .cv-card { background: #fff; border-radius: 20px; box-shadow: 0 14px 40px rgba(120, 96, 82, .10); overflow: hidden; }
  .cv-head {
    padding: 22px 22px 18px; text-align: center;
    background: linear-gradient(160deg, #fdeef2, #fff 70%);
  }
  .cv-head .st { display: inline-block; font-size: 12px; padding: 4px 12px; border-radius: 999px; background: #fff0f3; color: #c0455f; margin-bottom: 12px; }
  .cv-head .st.done { background: #eef7f1; color: #2f8a5b; }
  .cv-head .st.cancel { background: #f4f1ee; color: #8b8178; }
  .cv-head h2 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
  .cv-head p { margin: 0; font-size: 12.5px; color: var(--t2); line-height: 1.7; }
  .cv-qr { padding: 6px 22px 18px; text-align: center; }
  .cv-qr .qr-box {
    width: 232px; height: 232px; margin: 0 auto; background: #fff; border-radius: 16px;
    padding: 8px; box-shadow: 0 6px 22px rgba(0, 0, 0, .07);
  }
  .cv-qr .qr-box svg { width: 100%; height: 100%; display: block; }
  .cv-qr .code-line { margin-top: 14px; font-size: 12.5px; color: var(--t2); }
  .cv-qr .code-line b { font-size: 17px; letter-spacing: 3px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cv-sec { padding: 0 20px 18px; }
  .cv-sec h3 { font-size: 13px; color: var(--t2); font-weight: 500; margin: 6px 0 10px; }
  .item-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 0; border-bottom: 1px dashed var(--line); font-size: 14px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row .nm { color: var(--ink); }
  .item-row .meta { font-size: 12px; color: var(--t2); margin-top: 3px; }
  .item-row .amt { color: #c0455f; font-weight: 600; white-space: nowrap; }
  .sum-row {
    display: flex; justify-content: space-between; padding: 12px 0 4px; font-size: 13px; color: var(--t2);
  }
  .sum-row b { color: var(--ink); font-size: 15px; }
  .info-line { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; color: var(--t2); }
  .info-line span:last-child { color: var(--ink); }
  .cv-foot { text-align: center; font-size: 11.5px; color: #b6aca4; line-height: 1.9; padding-top: 18px; }
  .done-badge {
    width: 64px; height: 64px; border-radius: 50%; background: #eef7f1; color: #2f8a5b;
    display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 14px;
  }
  .cv-loading { text-align: center; padding: 60px 0; color: var(--t2); font-size: 13px; }
  .pulse { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  .err-box { text-align: center; padding: 48px 24px; }
  .err-box .ico { font-size: 34px; margin-bottom: 12px; }
  .err-box h2 { font-size: 16px; margin: 0 0 8px; }
  .err-box p { font-size: 13px; color: var(--t2); line-height: 1.8; margin: 0; }
  .refresh-tip { text-align: center; font-size: 11.5px; color: #b6aca4; padding: 0 0 14px; }
</style>
<link rel="stylesheet" href="../assets/css/polish-mobile.css" />
</head>
<body>
<div class="cv-wrap">
  <div class="cv-brand">
    <div class="mark">兰</div>
    <div>
      <h1>兰瓶美业</h1>
      <p>消费核销凭证</p>
    </div>
  </div>

  <div class="cv-card" id="card">
    <div class="cv-loading pulse">核销信息加载中…</div>
  </div>

  <div class="cv-foot">
    请将本页二维码出示给门店员工扫描完成核销<br />
    如有疑问请联系门店前台 · 兰瓶美业
  </div>
</div>

<script src="/assets/js/lp-api.js"></script>
<script src="/assets/js/lp-mock.js?v=47"></script>
<script src="/assets/js/lp-qr.js"></script>
<script>
(function () {
  var card = document.getElementById('card');
  var token = LP.param('t') || LP.param('token') || '';
  var timer = null;
  var finished = false;

  function errorBox(title, msg) {
    card.innerHTML = '<div class="err-box"><div class="ico">🔗</div><h2>' + LP.esc(title) + '</h2><p>' + LP.esc(msg) + '</p></div>';
  }

  function render(d) {
    var done = d.status === '已完成';
    var cancelled = d.status === '已取消' || d.status === '已冲正';
    if (done || cancelled) finished = true;

    var itemsHtml = (d.items || []).map(function (it) {
      return '<div class="item-row"><div><div class="nm">' + LP.esc(it.name) + '</div>' +
        '<div class="meta">' + it.times + ' 次 × ' + LP.fmt.money(it.price) + '</div></div>' +
        '<div class="amt">' + LP.fmt.money((it.price || 0) * (it.times || 0)) + '</div></div>';
    }).join('') || '<div class="item-row"><div class="nm">—</div></div>';

    var headHtml = done
      ? '<div class="done-badge">✓</div><h2>本次消费已核销完成</h2><p>感谢您的光临，期待下次再见</p>'
      : cancelled
        ? '<div class="done-badge" style="background:#f4f1ee;color:#8b8178">×</div><h2>本次核销已' + LP.esc(d.status.replace('已', '')) + '</h2><p>如需帮助请联系门店前台</p>'
        : '<span class="st">待核销</span><h2>请出示下方二维码</h2><p>门店员工扫码后即可完成本次消费核销</p>';

    card.innerHTML =
      '<div class="cv-head">' + headHtml + '</div>' +
      (done || cancelled ? '' :
        '<div class="cv-qr">' +
        '<div class="qr-box" id="qrBox"></div>' +
        '<div class="code-line">核销码 <b>' + LP.esc(d.code) + '</b></div>' +
        '</div>') +
      '<div class="cv-sec">' +
      '<h3>消费明细</h3>' + itemsHtml +
      '<div class="sum-row"><span>合计次数</span><b>' + d.total_times + ' 次</b></div>' +
      '<div class="sum-row"><span>合计金额</span><b>' + LP.fmt.money(d.total_amount) + '</b></div>' +
      '</div>' +
      '<div class="cv-sec" style="border-top:1px solid #f6f2ee">' +
      '<div class="info-line"><span>客户</span><span>' + LP.esc(d.customer_name || '—') + ' ' + LP.esc(d.customer_phone || '') + '</span></div>' +
      '<div class="info-line"><span>门店</span><span>' + LP.esc(d.store_name || '—') + '</span></div>' +
      '<div class="info-line"><span>服务员工</span><span>' + LP.esc(d.staff_name || '—') + '</span></div>' +
      '<div class="info-line"><span>开单时间</span><span>' + LP.fmt.datetime(d.created_at) + '</span></div>' +
      '<div class="info-line"><span>状态</span><span>' + LP.esc(d.status) + '</span></div>' +
      '</div>' +
      (done || cancelled ? '' : '<div class="refresh-tip pulse">等待员工扫码核销…（本页自动刷新状态）</div>');

    if (!done && !cancelled && window.LPQR) {
      var box = document.getElementById('qrBox');
      try { LPQR.render(box, location.href, {}); } catch (e) { box.innerHTML = ''; }
    }
  }

  function load() {
    if (!token) return errorBox('缺少核销参数', '请通过短信中的核销链接打开本页。');
    LP.get('/api/public/verification/' + encodeURIComponent(token))
      .then(function (d) {
        render(d);
        if (!finished) {
          clearTimeout(timer);
          timer = setTimeout(load, 8000);
        }
      })
      .catch(function (e) {
        if (/404|无效|失效/.test(e.message)) {
          errorBox('链接无效或已失效', '核销链接可能已被使用或过期，请联系门店前台重新发起核销。');
        } else {
          errorBox('加载失败', e.message + '，请稍后刷新页面重试。');
        }
      });
  }
  load();
})();
</script>
</body>
</html>
