<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户管理 · 兰瓶管理后台</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <link rel="stylesheet" href="../assets/css/polish.css" />
</head>
<body data-page="customers">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-title">客户管理 <span>全部门店客户基础数据与持卡情况</span></div>
        <div class="topbar-actions" id="top-user"></div>
      </header>
      <div class="content">
        <div class="stat-grid" style="grid-template-columns: repeat(4, 1fr);" id="stats"></div>

        <div class="panel">
          <div class="panel-hd">
            <h3>客户列表</h3>
            <span>
              <button class="btn ghost" id="btn-export">导出 CSV</button>
              <button class="btn" id="btn-new">+ 新增客户</button>
            </span>
          </div>
          <div class="panel-bd">
            <div class="toolbar">
              <input class="field search" id="f-q" placeholder="姓名 / 手机号 / 会员编号" style="width:260px;" />
              <select class="field" id="f-level" style="width:140px;">
                <option value="">全部等级</option>
                <option value="钻石">钻石会员</option>
                <option value="金卡">金卡会员</option>
                <option value="银卡">银卡会员</option>
              </select>
              <select class="field" id="f-store" style="width:150px;"><option value="">全部门店</option></select>
              <select class="field" id="f-status" style="width:130px;">
                <option value="">全部状态</option>
                <option value="active">正常</option>
                <option value="sleep">休眠</option>
              </select>
              <button class="btn" id="btn-search">查询</button>
            </div>
          </div>
          <div class="lp-scroll-x" id="list"></div>
          <div class="pagination" id="count"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script src="js/layout.js"></script>
  <script>
  (function () {
    'use strict';
    var STORES = [];
    var ROWS = [];

    function err(e) { LP.toast((e && e.message) || '操作失败', 'error'); }
    function lv(r) { return String(r.level || '').replace(/会员$/, ''); }

    function levelTag(r) {
      var t = { '钻石': 'tag-brown', '金卡': 'tag-orange', '银卡': 'tag-gray' }[lv(r)] || 'tag-blue';
      return '<span class="tag ' + t + '">' + LP.esc(lv(r) || '普通') + '会员</span>';
    }
    function statusTag(r) {
      return r.status === 'sleep'
        ? '<span class="tag tag-gray">休眠</span>'
        : '<span class="tag tag-green">正常</span>';
    }
    function storeOptions() {
      return [{ value: '', label: '未分配门店' }].concat(STORES.map(function (s) {
        return { value: s.id, label: s.name };
      }));
    }

    function renderStats() {
      var sleep = ROWS.filter(function (r) { return r.status === 'sleep'; });
      var vip = ROWS.filter(function (r) { return lv(r) === '钻石' || lv(r) === '金卡'; });
      var spent = ROWS.reduce(function (a, b) { return a + (Number(b.spent) || 0); }, 0);
      document.getElementById('stats').innerHTML =
        '<div class="stat-card"><div class="label">客户总数<span class="icon-box brown">👤</span></div>' +
          '<div class="value">' + LP.fmt.num(ROWS.length) + '</div><div class="trend">当前筛选条件</div></div>' +
        '<div class="stat-card"><div class="label">高价值客户<span class="icon-box orange">★</span></div>' +
          '<div class="value">' + LP.fmt.num(vip.length) + '</div><div class="trend">钻石 ' +
          ROWS.filter(function (r) { return lv(r) === '钻石'; }).length + ' · 金卡 ' +
          ROWS.filter(function (r) { return lv(r) === '金卡'; }).length + '</div></div>' +
        '<div class="stat-card"><div class="label">累计消费<span class="icon-box green">¥</span></div>' +
          '<div class="value">' + LP.fmt.money(spent) + '</div><div class="trend">人均 ' +
          LP.fmt.money(ROWS.length ? spent / ROWS.length : 0) + '</div></div>' +
        '<div class="stat-card"><div class="label">休眠待唤醒<span class="icon-box blue">⏰</span></div>' +
          '<div class="value">' + LP.fmt.num(sleep.length) + '</div>' +
          '<div class="trend"><a class="btn-link" href="settings.html">去发短信 →</a></div></div>';
    }

    function renderList() {
      LP.mount('#list', LP.table({
        columns: [
          { title: '客户', render: function (r) {
              return '<div class="user-cell">' + LP.avatar(r.name, r.avatar ? '../' + String(r.avatar).replace(/^\.?\//, '') : '') +
                '<div>' + LP.esc(r.name || '—') + '<br/><span class="meta">' + LP.esc(r.code || '—') + '</span></div></div>';
          }},
          { title: '手机号', render: function (r) { return LP.esc(LP.fmt.phone(r.phone)); } },
          { title: '会员等级', render: levelTag },
          { title: '所属门店', render: function (r) { return LP.esc(r.store_name || '—'); } },
          { title: '剩余次数', render: function (r) { return LP.fmt.num(r.remain) + ' 次'; } },
          { title: '累计消费', cls: 'price', render: function (r) { return LP.fmt.money(r.spent); } },
          { title: '生日', render: function (r) { return LP.esc(r.birthday || '—'); } },
          { title: '最近到店', render: function (r) { return LP.esc(LP.fmt.date(r.last_visit)); } },
          { title: '状态', render: statusTag },
          { title: '操作', render: function (r) {
              return '<span class="ops">' +
                '<a class="btn-link" data-act="detail" data-id="' + r.id + '">详情</a>' +
                '<a class="btn-link" data-act="edit" data-id="' + r.id + '">编辑</a></span>';
          }}
        ],
        rows: ROWS,
        emptyText: '没有匹配的客户'
      }));
      LP.mount('#count', '<span>共 ' + ROWS.length + ' 位客户</span>');
    }

    function load() {
      LP.mount('#list', '<div style="padding:18px;">' + LP.skeleton(6) + '</div>');
      LP.get('/api/customers', {
        q: document.getElementById('f-q').value.trim(),
        level: document.getElementById('f-level').value,
        store_id: document.getElementById('f-store').value,
        status: document.getElementById('f-status').value,
        pageSize: 200
      }).then(function (d) {
        ROWS = (d && d.list) || d || [];
        renderStats();
        renderList();
      }).catch(function (e) {
        err(e);
        LP.mount('#list', LP.empty('客户数据加载失败'));
      });
    }

    function schema(row) {
      row = row || {};
      return [
        { name: 'name', label: '姓名', required: true, value: row.name || '' },
        { name: 'phone', label: '手机号', type: 'tel', required: true, value: row.phone || '' },
        { name: 'gender', label: '性别', type: 'select', options: [{ value: '女', label: '女' }, { value: '男', label: '男' }], value: row.gender || '女' },
        { name: 'level', label: '会员等级', type: 'select', options: [{ value: '普通', label: '普通' }, { value: '银卡', label: '银卡' }, { value: '金卡', label: '金卡' }, { value: '钻石', label: '钻石' }], value: lv(row) || '普通' },
        { name: 'store_id', label: '所属门店', type: 'select', options: storeOptions(), value: row.store_id || '' },
        { name: 'birthday', label: '生日', placeholder: 'MM-DD', value: row.birthday || '' },
        { name: 'note', label: '备注', type: 'textarea', full: true, value: row.note || '' }
      ];
    }

    function openForm(row) {
      var editing = !!(row && row.id);
      LP.formModal({
        title: editing ? '编辑客户' : '新增客户',
        fields: schema(row),
        okText: editing ? '保存' : '创建',
        onSubmit: function (out) {
          if (!/^1\d{10}$/.test(String(out.phone || ''))) {
            LP.toast('手机号需为 11 位数字', 'error');
            return false;
          }
          var body = {
            name: out.name, phone: out.phone, gender: out.gender, level: out.level,
            store_id: out.store_id || null, birthday: out.birthday, note: out.note
          };
          var p = editing ? LP.put('/api/customers/' + row.id, body) : LP.post('/api/customers', body);
          return p.then(function () {
            LP.toast(editing ? '客户信息已更新' : '客户已创建', 'success');
            load();
          });
        }
      });
    }

    function detail(id) {
      LP.modal({
        title: '客户详情',
        body: LP.skeleton(6),
        footer: null,
        width: 780,
        onMount: function (api) {
          LP.get('/api/customers/' + id).then(function (c) {
            var head =
              '<div style="display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-bottom:16px;">' +
              '<div><div style="font-size:17px;font-weight:650;">' + LP.esc(c.name || '—') + ' ' + levelTag(c) + '</div>' +
              '<div style="font-size:13px;color:#67707f;margin-top:6px;">' + LP.esc(LP.fmt.phone(c.phone)) + ' · ' + LP.esc(c.code || '—') + '</div>' +
              '<div style="font-size:13px;color:#67707f;margin-top:4px;">门店：' + LP.esc(c.store_name || '—') + ' · 生日：' + LP.esc(c.birthday || '—') + '</div></div>' +
              '<div style="text-align:right;"><div style="font-size:12px;color:#9aa3b2;">累计消费</div>' +
              '<div style="font-size:22px;font-weight:650;color:#7f6455;">' + LP.fmt.money(c.spent) + '</div>' +
              '<div style="font-size:12px;color:#9aa3b2;margin-top:4px;">剩余 ' + LP.fmt.num(c.remain) + ' 次 · 到店 ' + LP.fmt.num(c.visit_count) + ' 次</div></div></div>';

            return Promise.all([
              LP.get('/api/cards', { customer_id: id }).catch(function () { return []; }),
              LP.get('/api/verifications', { customer_id: id }).catch(function () { return []; })
            ]).then(function (arr) {
              var cards = (arr[0] && arr[0].list) || arr[0] || [];
              var vers = (arr[1] && arr[1].list) || arr[1] || [];

              var cardTable = LP.table({
                columns: [
                  { title: '项目', render: function (r) { return LP.esc(r.project_name || '—'); } },
                  { title: '卡号', render: function (r) { return LP.esc(r.card_no || '—'); } },
                  { title: '次数', render: function (r) { return LP.fmt.num(r.used_times) + ' / ' + LP.fmt.num(r.total_times); } },
                  { title: '金额', cls: 'price', render: function (r) { return LP.fmt.money(r.amount); } },
                  { title: '到期', render: function (r) { return LP.esc(LP.fmt.date(r.expire_at)); } },
                  { title: '状态', render: function (r) { return LP.tag(r.status || '—'); } }
                ],
                rows: cards,
                emptyText: '暂无持卡项目'
              });

              var verTable = LP.table({
                columns: [
                  { title: '时间', render: function (r) { return LP.esc(LP.fmt.datetime(r.created_at || r.at)); } },
                  { title: '项目', render: function (r) { return LP.esc(r.project_name || '—'); } },
                  { title: '员工', render: function (r) { return LP.esc(r.staff_name || '—'); } },
                  { title: '金额', cls: 'price', render: function (r) { return LP.fmt.money(r.verify_amount || r.amount); } },
                  { title: '状态', render: function (r) { return LP.tag(r.status || '—'); } }
                ],
                rows: vers.slice(0, 10),
                emptyText: '暂无核销记录'
              });

              api.body.innerHTML = head +
                '<div style="border:1px solid #eceef4;border-radius:12px;overflow:hidden;margin-bottom:14px;">' +
                '<div style="padding:12px 16px;border-bottom:1px solid #eceef4;font-size:13.5px;font-weight:600;">持卡项目</div>' +
                '<div class="lp-scroll-x">' + cardTable + '</div></div>' +
                '<div style="border:1px solid #eceef4;border-radius:12px;overflow:hidden;">' +
                '<div style="padding:12px 16px;border-bottom:1px solid #eceef4;font-size:13.5px;font-weight:600;">最近核销</div>' +
                '<div class="lp-scroll-x">' + verTable + '</div></div>';
            });
          }).catch(function (e) {
            err(e);
            api.body.innerHTML = LP.empty('客户详情加载失败');
          });
        }
      });
    }

    function exportCsv() {
      if (!ROWS.length) { LP.toast('当前没有可导出的数据', 'error'); return; }
      var head = ['姓名', '会员编号', '手机号', '等级', '门店', '剩余次数', '累计消费', '生日', '最近到店', '状态'];
      var lines = [head.join(',')].concat(ROWS.map(function (r) {
        return [r.name, r.code, r.phone, lv(r), r.store_name, r.remain, r.spent, r.birthday, r.last_visit,
          r.status === 'sleep' ? '休眠' : '正常'].map(function (v) {
          return '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
        }).join(',');
      }));
      var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '客户列表_' + LP.today() + '.csv';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
      LP.toast('已导出 ' + ROWS.length + ' 条', 'success');
    }

    function init(me) {
      document.dispatchEvent(new CustomEvent('lp:user', { detail: me }));
      LP.get('/api/stores').then(function (list) {
        STORES = (list || []).filter(function (s) { return s.status !== '停业'; });
        document.getElementById('f-store').innerHTML = '<option value="">全部门店</option>' + STORES.map(function (s) {
          return '<option value="' + s.id + '">' + LP.esc(s.name) + '</option>';
        }).join('');
      }).catch(err).then(load);

      document.getElementById('btn-search').addEventListener('click', load);
      document.getElementById('f-q').addEventListener('input', LP.debounce(load, 400));
      ['f-level', 'f-store', 'f-status'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', load);
      });
      document.getElementById('btn-new').addEventListener('click', function () { openForm(null); });
      document.getElementById('btn-export').addEventListener('click', exportCsv);

      LP.on(document, 'click', '[data-act="detail"]', function (e, t) { detail(t.getAttribute('data-id')); });
      LP.on(document, 'click', '[data-act="edit"]', function (e, t) {
        var id = t.getAttribute('data-id');
        var row = ROWS.filter(function (r) { return String(r.id) === String(id); })[0];
        openForm(row || { id: id });
      });
    }

    LP.requireRoles(['admin']).then(init).catch(function () {});
  })();
  </script>
</body>
</html>
