<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>核销列表 · 兰瓶管理后台</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <link rel="stylesheet" href="../assets/css/polish.css" />
</head>
<body data-page="verify">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-title">核销列表 <span>核销明细、补退次与取消</span></div>
        <div class="topbar-actions" id="top-user"></div>
      </header>
      <div class="content">
        <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);" id="stats"></div>

        <div class="panel">
          <div class="panel-hd">
            <h3>核销记录</h3>
            <button class="btn ghost" id="btn-reset">重置筛选</button>
          </div>
          <div class="panel-bd">
            <div class="toolbar">
              <input class="field search" id="f-q" placeholder="客户 / 手机号 / 项目 / 员工" style="width:250px;" />
              <select class="field" id="f-store" style="width:150px;"><option value="">全部门店</option></select>
              <select class="field" id="f-status" style="width:140px;">
                <option value="">全部状态</option>
                <option value="待核销">待核销</option>
                <option value="已完成">已完成</option>
                <option value="已退次">已退次</option>
              </select>
              <input class="field" type="date" id="f-date" style="width:150px;" />
              <button class="btn" id="btn-search">查询</button>
            </div>
          </div>
          <div class="lp-scroll-x" id="list"></div>
          <div class="pagination" id="count"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script src="js/layout.js"></script>
  <script>
  (function () {
    'use strict';
    var STORES = [];
    var ROWS = [];

    function err(e) { LP.toast((e && e.message) || '操作失败', 'error'); }

    function itemsText(r) {
      var items = r.items;
      if (typeof items === 'string') { try { items = JSON.parse(items); } catch (e) { items = []; } }
      return (items || []).map(function (i) {
        return LP.esc(i.name || '项目') + ' <span class="meta">×' + (i.times || 1) + '</span>';
      }).join('、') || LP.esc(r.project_name || '—');
    }
    function itemsTotal(r) {
      var items = r.items;
      if (typeof items === 'string') { try { items = JSON.parse(items); } catch (e) { items = []; } }
      if (items && items.length) {
        return items.reduce(function (a, b) { return a + (Number(b.price) || 0) * (Number(b.times) || 0); }, 0);
      }
      return Number(r.total_amount || r.amount) || 0;
    }
    function statusTag(r) {
      var m = { '待核销': 'tag-orange', '已完成': 'tag-green', '已退次': 'tag-gray', '已取消': 'tag-gray' };
      return '<span class="tag ' + (m[r.status] || 'tag-blue') + '">' + LP.esc(r.status || '—') + '</span>';
    }

    function filtered() {
      var q = document.getElementById('f-q').value.trim().toLowerCase();
      var date = document.getElementById('f-date').value;
      return ROWS.filter(function (r) {
        if (date && String(r.created_at || r.at || '').slice(0, 10) !== date) return false;
        if (!q) return true;
        var hay = [r.customer_name, r.customer_phone, r.staff_name, r.store_name, r.project_name,
          (typeof r.items === 'string' ? r.items : JSON.stringify(r.items || []))].join(' ').toLowerCase();
        return hay.indexOf(q) >= 0;
      });
    }

    function renderStats(rows) {
      var done = rows.filter(function (r) { return r.status === '已完成'; });
      var pending = rows.filter(function (r) { return r.status === '待核销'; });
      document.getElementById('stats').innerHTML =
        '<div class="stat-card"><div class="label">待核销<span class="icon-box orange">⏳</span></div>' +
          '<div class="value">' + LP.fmt.num(pending.length) + '</div><div class="trend">等待客户到店确认</div></div>' +
        '<div class="stat-card"><div class="label">已完成笔数<span class="icon-box green">✓</span></div>' +
          '<div class="value">' + LP.fmt.num(done.length) + '</div><div class="trend">当前筛选条件</div></div>' +
        '<div class="stat-card"><div class="label">已完成金额<span class="icon-box brown">¥</span></div>' +
          '<div class="value">' + LP.fmt.money(done.reduce(function (a, b) { return a + itemsTotal(b); }, 0)) + '</div>' +
          '<div class="trend">项目原价合计</div></div>';
    }

    function renderList() {
      var rows = filtered();
      renderStats(rows);
      LP.mount('#list', LP.table({
        columns: [
          { title: '核销时间', render: function (r) { return LP.esc(LP.fmt.datetime(r.created_at || r.at)); } },
          { title: '客户', render: function (r) {
              return LP.esc(r.customer_name || '—') + '<br/><span class="meta">' + LP.esc(LP.fmt.phone(r.customer_phone)) + '</span>';
          }},
          { title: '项目明细', render: itemsText },
          { title: '次数', render: function (r) { return LP.fmt.num(r.total_times || r.times || 1) + ' 次'; } },
          { title: '项目原价', cls: 'price', render: function (r) { return LP.fmt.money(itemsTotal(r)); } },
          { title: '服务员工', render: function (r) { return LP.esc(r.staff_name || '—'); } },
          { title: '门店', render: function (r) { return LP.esc(r.store_name || '—'); } },
          { title: '状态', render: statusTag },
          { title: '操作', render: function (r) {
              var ops = [];
              if (r.status === '已完成') ops.push('<a class="btn-link danger" data-act="refund" data-id="' + r.id + '">补退</a>');
              if (r.status === '待核销') ops.push('<a class="btn-link danger" data-act="cancel" data-id="' + r.id + '">取消</a>');
              ops.push('<a class="btn-link" data-act="detail" data-id="' + r.id + '">详情</a>');
              return '<span class="ops">' + ops.join('') + '</span>';
          }}
        ],
        rows: rows,
        emptyText: '没有匹配的核销记录'
      }));
      LP.mount('#count', '<span>共 ' + rows.length + ' 条记录</span>');
    }

    function load() {
      LP.mount('#list', '<div style="padding:18px;">' + LP.skeleton(6) + '</div>');
      LP.get('/api/verifications', {
        store_id: document.getElementById('f-store').value,
        status: document.getElementById('f-status').value,
        pageSize: 300
      }).then(function (d) {
        ROWS = (d && d.list) || d || [];
        renderList();
      }).catch(function (e) {
        err(e);
        LP.mount('#list', LP.empty('核销记录加载失败'));
      });
    }

    function detail(id) {
      var r = ROWS.filter(function (x) { return String(x.id) === String(id); })[0] || {};
      var items = r.items;
      if (typeof items === 'string') { try { items = JSON.parse(items); } catch (e) { items = []; } }
      LP.modal({
        title: '核销详情',
        footer: null,
        width: 620,
        body:
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:13px;margin-bottom:14px;">' +
          '<div><span style="color:#9aa3b2;">核销单号</span><br/>' + LP.esc(r.verify_no || r.id || '—') + '</div>' +
          '<div><span style="color:#9aa3b2;">核销时间</span><br/>' + LP.esc(LP.fmt.datetime(r.created_at || r.at)) + '</div>' +
          '<div><span style="color:#9aa3b2;">客户</span><br/>' + LP.esc(r.customer_name || '—') + ' ' + LP.esc(LP.fmt.phone(r.customer_phone)) + '</div>' +
          '<div><span style="color:#9aa3b2;">服务员工</span><br/>' + LP.esc(r.staff_name || '—') + '</div>' +
          '<div><span style="color:#9aa3b2;">门店</span><br/>' + LP.esc(r.store_name || '—') + '</div>' +
          '<div><span style="color:#9aa3b2;">渠道</span><br/>' + LP.esc(r.channel || '—') + '</div>' +
          '</div>' +
          LP.table({
            columns: [
              { title: '项目', render: function (x) { return LP.esc(x.name || '—'); } },
              { title: '次数', render: function (x) { return LP.fmt.num(x.times || 1); } },
              { title: '单价', cls: 'price', render: function (x) { return LP.fmt.money(x.price); } }
            ],
            rows: items || [],
            emptyText: '无明细'
          })
      });
    }

    function act(id, kind) {
      var r = ROWS.filter(function (x) { return String(x.id) === String(id); })[0];
      if (!r) return;
      var isRefund = kind === 'refund';
      LP.confirm(isRefund ? '确认给该核销单补退 1 次？' : '确认取消这条核销单？',
        { danger: true, okText: isRefund ? '补退' : '取消' }).then(function (ok) {
        if (!ok) return;
        LP.put('/api/verifications/' + r.id + '/status', { status: isRefund ? '已退次' : '已取消' })
          .then(function () { LP.toast('已处理', 'success'); load(); })
          .catch(err);
      }).catch(err);
    }

    function init(me) {
      document.dispatchEvent(new CustomEvent('lp:user', { detail: me }));
      LP.get('/api/stores').then(function (list) {
        STORES = (list || []).filter(function (s) { return s.status !== '停业'; });
        document.getElementById('f-store').innerHTML = '<option value="">全部门店</option>' + STORES.map(function (s) {
          return '<option value="' + s.id + '">' + LP.esc(s.name) + '</option>';
        }).join('');
      }).catch(err).then(load);

      document.getElementById('btn-search').addEventListener('click', function () { renderList(); });
      document.getElementById('f-q').addEventListener('input', LP.debounce(renderList, 300));
      ['f-store', 'f-status', 'f-date'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', function () {
          if (id === 'f-store' || id === 'f-status') load(); else renderList();
        });
      });
      document.getElementById('btn-reset').addEventListener('click', function () {
        document.getElementById('f-q').value = '';
        document.getElementById('f-date').value = '';
        document.getElementById('f-store').value = '';
        document.getElementById('f-status').value = '';
        load();
      });

      LP.on(document, 'click', '[data-act="detail"]', function (e, t) { detail(t.getAttribute('data-id')); });
      LP.on(document, 'click', '[data-act="refund"]', function (e, t) { act(t.getAttribute('data-id'), 'refund'); });
      LP.on(document, 'click', '[data-act="cancel"]', function (e, t) { act(t.getAttribute('data-id'), 'cancel'); });
    }

    LP.requireRoles(['admin']).then(init).catch(function () {});
  })();
  </script>
</body>
</html>
