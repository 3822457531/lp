<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>福利设置 · 兰瓶管理后台</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <link rel="stylesheet" href="../assets/css/polish.css" />
</head>
<body data-page="welfare">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-title">福利设置 <span>客户福利与员工福利的发放规则</span></div>
        <div class="topbar-actions" id="top-user"></div>
      </header>
      <div class="content">
        <div class="panel">
          <div class="panel-hd">
            <h3>福利模板</h3>
            <button class="btn" id="btn-new">+ 新增福利</button>
          </div>
          <div class="lp-scroll-x" id="list"></div>
        </div>

        <div class="panel">
          <div class="panel-hd"><h3>发放记录</h3><span style="font-size:12px;color:#9aa3b2;">最近发放</span></div>
          <div class="lp-scroll-x" id="issued"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script src="js/layout.js"></script>
  <script>
  (function () {
    'use strict';
    var ROWS = [];

    function err(e) { LP.toast((e && e.message) || '操作失败', 'error'); }

    function renderList() {
      if (!ROWS.length) {
        LP.mount('#list', LP.empty('暂无福利模板'));
        return;
      }
      var html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px;">' +
        ROWS.map(function (r) {
          return '<div style="border:1px solid #eceef4;border-radius:14px;padding:16px;background:#fff;">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
            '<b style="font-size:14px;">' + LP.esc(r.name || '—') + '</b>' +
            (r.status === '停用'
              ? '<span class="tag tag-gray">停用</span>'
              : '<span class="tag tag-green">启用</span>') + '</div>' +
            '<div style="margin:10px 0 12px;color:#7f6455;font-size:19px;font-weight:650;">' +
            (r.type === '金额' ? LP.fmt.money(r.amount) : LP.fmt.num(r.amount) + ' 次') + '</div>' +
            '<div style="font-size:12.5px;color:#67707f;line-height:1.9;">' +
            '适用：' + LP.esc(r.scope || '全部客户') + '<br/>' +
            '条件：' + LP.esc(r.condition || '到店即享') + '<br/>' +
            '有效期：' + LP.esc(r.validity || '发放后 30 天') + '</div>' +
            '<div style="margin-top:12px;display:flex;gap:14px;">' +
            '<a class="btn-link" data-act="edit" data-id="' + r.id + '">编辑</a>' +
            '<a class="btn-link" data-act="issue" data-id="' + r.id + '">发放</a>' +
            '<a class="btn-link danger" data-act="del" data-id="' + r.id + '">删除</a></div>' +
            '</div>';
        }).join('') + '</div>';
      LP.mount('#list', html);
    }

    function load() {
      LP.get('/api/welfare').then(function (d) {
        ROWS = (d && d.list) || d || [];
        renderList();
      }).catch(function (e) {
        err(e);
        LP.mount('#list', LP.empty('福利数据加载失败'));
      });

      LP.get('/api/welfare/issued').then(function (d) {
        var rows = (d && d.list) || d || [];
        LP.mount('#issued', LP.table({
          columns: [
            { title: '受益客户', render: function (r) { return LP.esc(r.customer_name || r.user_name || '—'); } },
            { title: '福利', render: function (r) { return LP.esc(r.welfare_name || r.name || '—'); } },
            { title: '金额/次数', cls: 'price', render: function (r) { return LP.fmt.money(r.amount); } },
            { title: '发放时间', render: function (r) { return LP.esc(LP.fmt.datetime(r.created_at)); } },
            { title: '状态', render: function (r) { return LP.tag(r.status || '已发放'); } }
          ],
          rows: rows,
          emptyText: '暂无发放记录'
        }));
      }).catch(function () {});
    }

    function openForm(row) {
      row = row || {};
      var editing = !!row.id;
      LP.formModal({
        title: editing ? '编辑福利' : '新增福利',
        okText: editing ? '保存' : '创建',
        fields: [
          { name: 'name', label: '福利名称', required: true, value: row.name || '' },
          { name: 'type', label: '类型', type: 'select', options: [{ value: '金额', label: '金额' }, { value: '次数', label: '次数' }], value: row.type || '金额' },
          { name: 'amount', label: '数值', type: 'number', value: row.amount === undefined ? 100 : row.amount },
          { name: 'scope', label: '适用范围', placeholder: '钻石会员 / 新客 / 全部客户', value: row.scope || '全部客户' },
          { name: 'condition', label: '触发条件', placeholder: '生日当月 / 到店即享 / 消费满 3000', value: row.condition || '到店即享' },
          { name: 'validity', label: '有效期', value: row.validity || '发放后 30 天' }
        ],
        onSubmit: function (out) {
          var body = {
            name: out.name, type: out.type, amount: Number(out.amount) || 0,
            scope: out.scope, condition: out.condition, validity: out.validity,
            status: row.status || '启用'
          };
          var p = editing ? LP.put('/api/welfare/' + row.id, body) : LP.post('/api/welfare', body);
          return p.then(function () { LP.toast(editing ? '已保存' : '已创建', 'success'); load(); });
        }
      });
    }

    function issue(id) {
      var r = ROWS.filter(function (x) { return String(x.id) === String(id); })[0] || {};
      LP.confirm('确定批量发放「' + (r.name || '') + '」给符合条件的客户？').then(function (ok) {
        if (!ok) return;
        LP.post('/api/welfare/' + r.id + '/issue', {}).then(function (d) {
          LP.toast('已发放 ' + ((d && d.count) || 0) + ' 人', 'success');
          load();
        }).catch(err);
      }).catch(err);
    }

    function del(id) {
      var r = ROWS.filter(function (x) { return String(x.id) === String(id); })[0] || {};
      LP.confirm('删除福利「' + (r.name || '') + '」？', { danger: true, okText: '删除' }).then(function (ok) {
        if (!ok) return;
        LP.del('/api/welfare/' + id).then(function () { LP.toast('已删除', 'success'); load(); }).catch(err);
      }).catch(err);
    }

    function init(me) {
      document.dispatchEvent(new CustomEvent('lp:user', { detail: me }));
      load();
      document.getElementById('btn-new').addEventListener('click', function () { openForm(null); });
      LP.on(document, 'click', '[data-act="edit"]', function (e, t) {
        var id = t.getAttribute('data-id');
        openForm(ROWS.filter(function (r) { return String(r.id) === String(id); })[0] || { id: id });
      });
      LP.on(document, 'click', '[data-act="issue"]', function (e, t) { issue(t.getAttribute('data-id')); });
      LP.on(document, 'click', '[data-act="del"]', function (e, t) { del(t.getAttribute('data-id')); });
    }

    LP.requireRoles(['admin']).then(init).catch(function () {});
  })();
  </script>
</body>
</html>
