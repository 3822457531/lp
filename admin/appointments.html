<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预约列表 · 兰瓶管理后台</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <link rel="stylesheet" href="../assets/css/polish.css" />
</head>
<body data-page="appointments">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-title">预约列表 <span>到店预约的确认、完成与取消</span></div>
        <div class="topbar-actions" id="top-user"></div>
      </header>
      <div class="content">
        <div class="stat-grid" style="grid-template-columns: repeat(4, 1fr);" id="stats"></div>

        <div class="panel">
          <div class="panel-hd">
            <h3>预约记录</h3>
            <button class="btn" id="btn-new">+ 新建预约</button>
          </div>
          <div class="panel-bd">
            <div class="toolbar">
              <input class="field search" id="f-q" placeholder="客户 / 手机号 / 项目 / 员工" style="width:250px;" />
              <select class="field" id="f-status" style="width:140px;">
                <option value="">全部状态</option>
                <option value="待确认">待确认</option>
                <option value="已确认">已确认</option>
                <option value="已完成">已完成</option>
                <option value="已取消">已取消</option>
              </select>
              <input class="field" type="date" id="f-date" style="width:150px;" />
              <button class="btn" id="btn-search">查询</button>
            </div>
          </div>
          <div class="lp-scroll-x" id="list"></div>
          <div class="pagination" id="count"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script src="js/layout.js"></script>
  <script>
  (function () {
    'use strict';
    var ROWS = [];
    var CUSTOMERS = [];
    var PROJECTS = [];
    var STAFF = [];

    function err(e) { LP.toast((e && e.message) || '操作失败', 'error'); }
    function statusTag(s) {
      var m = { '待确认': 'tag-orange', '已确认': 'tag-blue', '已完成': 'tag-green', '已取消': 'tag-gray' };
      return '<span class="tag ' + (m[s] || 'tag-blue') + '">' + LP.esc(s || '—') + '</span>';
    }

    function renderStats() {
      var c = {};
      ROWS.forEach(function (r) { c[r.status] = (c[r.status] || 0) + 1; });
      document.getElementById('stats').innerHTML =
        '<div class="stat-card"><div class="label">今日预约<span class="icon-box brown">📅</span></div>' +
          '<div class="value">' + ROWS.filter(function (r) { return String(r.date || '').slice(0, 10) === LP.today(); }).length + '</div>' +
          '<div class="trend">' + LP.today() + '</div></div>' +
        '<div class="stat-card"><div class="label">待确认<span class="icon-box orange">⏳</span></div>' +
          '<div class="value">' + (c['待确认'] || 0) + '</div><div class="trend">需要店长确认</div></div>' +
        '<div class="stat-card"><div class="label">已确认<span class="icon-box blue">✓</span></div>' +
          '<div class="value">' + (c['已确认'] || 0) + '</div><div class="trend">待到店</div></div>' +
        '<div class="stat-card"><div class="label">已完成<span class="icon-box green">★</span></div>' +
          '<div class="value">' + (c['已完成'] || 0) + '</div><div class="trend">已到店服务</div></div>';
    }

    function renderList() {
      var q = document.getElementById('f-q').value.trim().toLowerCase();
      var status = document.getElementById('f-status').value;
      var date = document.getElementById('f-date').value;
      var rows = ROWS.filter(function (r) {
        if (status && r.status !== status) return false;
        if (date && String(r.date || '').slice(0, 10) !== date) return false;
        if (!q) return true;
        return [r.customer_name, r.customer_phone, r.project_name, r.staff_name]
          .join(' ').toLowerCase().indexOf(q) >= 0;
      });
      renderStats();
      LP.mount('#list', LP.table({
        columns: [
          { title: '预约时间', render: function (r) {
              return '<b>' + LP.esc(LP.fmt.date(r.date)) + '</b> <span class="meta">' + LP.esc(r.time || '') + '</span>';
          }},
          { title: '客户', render: function (r) {
              return LP.esc(r.customer_name || '—') + '<br/><span class="meta">' + LP.esc(LP.fmt.phone(r.customer_phone)) + '</span>';
          }},
          { title: '项目', render: function (r) { return LP.esc(r.project_name || '—'); } },
          { title: '服务员工', render: function (r) { return LP.esc(r.staff_name || '—'); } },
          { title: '门店', render: function (r) { return LP.esc(r.store_name || '—'); } },
          { title: '状态', render: function (r) { return statusTag(r.status); } },
          { title: '操作', render: function (r) {
              var ops = [];
              if (r.status === '待确认') {
                ops.push('<a class="btn-link" data-act="confirm" data-id="' + r.id + '">确认</a>');
                ops.push('<a class="btn-link danger" data-act="cancel" data-id="' + r.id + '">拒绝</a>');
              } else if (r.status === '已确认') {
                ops.push('<a class="btn-link" data-act="done" data-id="' + r.id + '">标记到店</a>');
              }
              ops.push('<a class="btn-link" data-act="edit" data-id="' + r.id + '">改约</a>');
              return '<span class="ops">' + ops.join('') + '</span>';
          }}
        ],
        rows: rows,
        emptyText: '没有匹配的预约'
      }));
      LP.mount('#count', '<span>共 ' + rows.length + ' 条预约</span>');
    }

    function load() {
      LP.mount('#list', '<div style="padding:18px;">' + LP.skeleton(6) + '</div>');
      LP.get('/api/appointments', { pageSize: 300 }).then(function (d) {
        ROWS = (d && d.list) || d || [];
        renderList();
      }).catch(function (e) {
        err(e);
        LP.mount('#list', LP.empty('预约数据加载失败'));
      });
    }

    function setStatus(id, next) {
      var r = ROWS.filter(function (x) { return String(x.id) === String(id); })[0];
      if (!r) return;
      LP.put('/api/appointments/' + r.id, Object.assign({}, r, { status: next })).then(function () {
        LP.toast('已更新为「' + next + '」', 'success');
        load();
      }).catch(err);
    }

    function openForm(row) {
      row = row || {};
      var editing = !!row.id;
      LP.formModal({
        title: editing ? '修改预约' : '新建预约',
        okText: editing ? '保存' : '创建',
        fields: [
          { name: 'customer_id', label: '客户', type: 'select', options: CUSTOMERS.map(function (c) {
              return { value: c.id, label: c.name + '（' + LP.fmt.phone(c.phone) + '）' };
            }), value: row.customer_id || '', required: true },
          { name: 'project_id', label: '项目', type: 'select', options: PROJECTS.map(function (p) {
              return { value: p.id, label: p.name };
            }), value: row.project_id || '', required: true },
          { name: 'staff_id', label: '服务员工', type: 'select', options: STAFF.map(function (s) {
              return { value: s.id, label: s.name };
            }), value: row.staff_id || '' },
          { name: 'date', label: '预约日期', type: 'date', value: row.date || LP.today(), required: true },
          { name: 'time', label: '预约时间', placeholder: '14:00', value: row.time || '14:00', required: true },
          { name: 'note', label: '备注', type: 'textarea', full: true, value: row.note || '' }
        ],
        onSubmit: function (out) {
          var body = {
            customer_id: out.customer_id, project_id: out.project_id, staff_id: out.staff_id || null,
            date: out.date, time: out.time, note: out.note, status: row.status || '待确认'
          };
          var p = editing ? LP.put('/api/appointments/' + row.id, body) : LP.post('/api/appointments', body);
          return p.then(function () {
            LP.toast(editing ? '预约已更新' : '预约已创建', 'success');
            load();
          });
        }
      });
    }

    function init(me) {
      document.dispatchEvent(new CustomEvent('lp:user', { detail: me }));
      Promise.all([
        LP.get('/api/customers', { pageSize: 500 }).catch(function () { return []; }),
        LP.get('/api/projects').catch(function () { return []; }),
        LP.get('/api/users').catch(function () { return []; })
      ]).then(function (arr) {
        CUSTOMERS = (arr[0] && arr[0].list) || arr[0] || [];
        PROJECTS = (arr[1] || []).filter(function (p) { return p.status !== '下架'; });
        STAFF = (arr[2] || []).filter(function (u) { return u.status === 'active'; });
        load();
      });

      document.getElementById('btn-search').addEventListener('click', renderList);
      document.getElementById('f-q').addEventListener('input', LP.debounce(renderList, 300));
      document.getElementById('f-status').addEventListener('change', renderList);
      document.getElementById('f-date').addEventListener('change', renderList);
      document.getElementById('btn-new').addEventListener('click', function () { openForm(null); });

      LP.on(document, 'click', '[data-act="confirm"]', function (e, t) { setStatus(t.getAttribute('data-id'), '已确认'); });
      LP.on(document, 'click', '[data-act="cancel"]', function (e, t) { setStatus(t.getAttribute('data-id'), '已取消'); });
      LP.on(document, 'click', '[data-act="done"]', function (e, t) { setStatus(t.getAttribute('data-id'), '已完成'); });
      LP.on(document, 'click', '[data-act="edit"]', function (e, t) {
        var id = t.getAttribute('data-id');
        openForm(ROWS.filter(function (r) { return String(r.id) === String(id); })[0] || { id: id });
      });
    }

    LP.requireRoles(['admin']).then(init).catch(function () {});
  })();
  </script>
</body>
</html>
