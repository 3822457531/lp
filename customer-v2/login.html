<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会员登录 · 兰瓶美业</title>
  <link rel="stylesheet" href="../css/mobile-app.css" />
  <link rel="stylesheet" href="../assets/css/lp-app.css" />
  <link rel="stylesheet" href="../assets/css/polish-mobile.css" />
  <style>
    .login-hero{background:linear-gradient(150deg,#f291ad 0%,#e2587c 55%,#c9435f 100%);padding:56px 24px 40px;color:#fff;border-radius:0 0 28px 28px;}
    .login-hero .logo{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;}
    .login-hero h1{font-size:24px;font-weight:700;letter-spacing:.5px;margin:0 0 6px;}
    .login-hero p{margin:0;font-size:12.5px;opacity:.9;}
    .login-form{padding:26px 22px 0;}
    .lf{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(24,28,40,.04);}
    .lf label{display:block;font-size:11.5px;color:#98a0ae;margin-bottom:6px;}
    .lf input{border:0;outline:0;width:100%;font-size:16px;color:#1f2329;background:transparent;font-family:inherit;}
    .lf-row{display:flex;align-items:center;gap:10px;}
    .lf-row .send{border:0;background:#fdeef3;color:#e2587c;font-size:12px;padding:7px 12px;border-radius:9px;white-space:nowrap;font-family:inherit;}
    .lf-row .send[disabled]{opacity:.55;}
    .login-tip{padding:6px 24px 0;font-size:11.5px;color:#98a0ae;line-height:1.7;}
    .login-btn{margin:18px 22px 0;display:block;width:calc(100% - 44px);border:0;height:48px;border-radius:14px;
      background:linear-gradient(135deg,#ec6f8e,#d94b6d);color:#fff;font-size:15.5px;font-weight:600;font-family:inherit;
      box-shadow:0 8px 18px rgba(217,75,109,.28);}
    .login-btn:active{transform:translateY(1px);}
  </style>
</head>
<body>
  <div class="phone-page">
    <div class="phone">
      <div class="status-bar" style="background:#f291ad;color:#fff;"><span>9:41</span><span>兰瓶</span><span>●●●</span></div>
      <div class="phone-body no-tab" style="background:#f6f7fb;">
        <div class="login-hero">
          <div class="logo">❀</div>
          <h1>兰瓶美业</h1>
          <p>会员登录 · 查看卡项、消费记录与预约</p>
        </div>

        <div class="login-form">
          <div class="lf">
            <label>手机号</label>
            <input id="f-phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号" value="13700000000" />
          </div>
          <div class="lf">
            <label>验证码</label>
            <div class="lf-row">
              <input id="f-code" type="tel" maxlength="6" placeholder="6 位验证码" value="0000" />
              <button class="send" id="btn-send" type="button">获取验证码</button>
            </div>
          </div>
        </div>

        <div class="login-tip">
          演示模式：任意 11 位手机号均可登录，验证码固定 <b>0000</b>。<br />
          用不同手机号登录，会进入不同的会员账号。
        </div>

        <button class="login-btn" id="btn-login" type="button">登 录</button>
        <div class="login-tip" style="text-align:center;padding-top:16px;">
          登录代表同意《会员服务协议》与《隐私政策》
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/lp-api.js"></script>
  <script src="../assets/js/lp-mock.js?v=47"></script>
  <script>
    (function () {
      'use strict';
      var back = LP.query ? (LP.query('back') || '') : '';
      var qs = new URLSearchParams(location.search);
      back = qs.get('back') || 'home.html';

      /* 已登录直接进 */
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('lp_user') || 'null'); } catch (e) { }
      if (saved && saved.role === 'customer') location.replace(back);

      var btnSend = document.getElementById('btn-send');
      var btnLogin = document.getElementById('btn-login');
      var tip = document.querySelector('.login-tip');

      btnSend.addEventListener('click', function () {
        var p = document.getElementById('f-phone').value.trim();
        if (!/^1\d{10}$/.test(p)) { LP.toast('请输入 11 位手机号', 'error'); return; }
        var n = 60;
        btnSend.disabled = true;
        btnSend.textContent = n + 's 后重发';
        var t = setInterval(function () {
          n--;
          if (n <= 0) { clearInterval(t); btnSend.disabled = false; btnSend.textContent = '获取验证码'; return; }
          btnSend.textContent = n + 's 后重发';
        }, 1000);
        LP.toast('验证码已发送：0000');
      });

      btnLogin.addEventListener('click', function () {
        var phone = document.getElementById('f-phone').value.trim();
        var code = document.getElementById('f-code').value.trim();
        if (!/^1\d{10}$/.test(phone)) { LP.toast('手机号格式不对', 'error'); return; }
        if (code.length !== 4 && code.length !== 6) { LP.toast('请输入 4-6 位验证码', 'error'); return; }
        btnLogin.disabled = true;
        btnLogin.textContent = '登录中…';
        LP.request('POST', '/api/auth/login', { phone: phone, code: code, role: 'customer' }).then(function (res) {
          var user = (res && res.user) || {};
          user.role = 'customer';
          if (LP.saveSession) LP.saveSession(res.token || 'mock-token-customer', user);
          else {
            localStorage.setItem('lp_token', res.token || 'mock-token-customer');
            localStorage.setItem('lp_user', JSON.stringify(user));
          }
          LP.toast('欢迎回来，' + (user.name || '会员'));
          location.replace(back || 'home.html');
        }).catch(function (e) {
          btnLogin.disabled = false;
          btnLogin.textContent = '登 录';
          LP.toast((e && e.message) || '登录失败，请重试', 'error');
        });
      });
    })();
  </script>
</body>
</html>
