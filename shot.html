<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>shot</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  #frame{position:relative;overflow:hidden;background:#fff;}
  #frame iframe{position:absolute;left:0;top:0;border:0;display:block;}
  #meta{position:fixed;right:8px;bottom:8px;font:12px/1.4 monospace;color:#999;background:#fff;padding:2px 6px;border-radius:4px;}
</style>
</head>
<body>
<div id="frame"></div>
<div id="meta"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var u = q.get('u') || 'admin/dashboard.html';
  var y = parseInt(q.get('y') || '0', 10);
  var w = parseInt(q.get('w') || '420', 10);
  var h = parseInt(q.get('h') || '820', 10);
  var full = q.get('full');
  var fr = document.getElementById('frame');
  fr.style.width = w + 'px';
  fr.style.height = (full ? 3000 : h) + 'px';
  var f = document.createElement('iframe');
  f.src = u;
  f.style.width = w + 'px';
  f.style.height = '3000px';
  f.style.transform = 'translateY(-' + y + 'px)';
  fr.appendChild(f);
  document.getElementById('meta').textContent = u + '  y=' + y;
})();
</script>
</body>
</html>
